<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kayıt - Karbon Ayak Izi</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; background: linear-gradient(135deg,#667eea,#764ba2); color: #111; margin:0; padding:40px; }
    .card { max-width:480px; margin:40px auto; background:white; padding:24px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.12);} 
    input { width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #e5e7eb }
    button { width:100%; padding:12px; border-radius:8px; background:#10b981; color:white; border:none; font-weight:700 }
    a { color:#2563eb }
    .muted { color:#6b7280; font-size:0.9rem }
  </style>
</head>
<body>
  <div class="card">
    <h2>Kayıt Ol</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div style="color:green">{{ m|safe }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% if error %}
      <div style="color:red">{{ error }}</div>
    {% endif %}
    <form method="post">
      <label>Ad</label>
      <input name="ad" required />
      <label>Soyad</label>
      <input name="soyad" required />
      <label>Kullanıcı adı</label>
      <input name="username" required />
      <label>Email</label>
      <input name="email" type="email" required />
      <label>Şifre (en az 8 karakter, 1 harf, 1 rakam)</label>
      <input name="password" type="password" required />
      <button type="submit">Kaydol</button>
    </form>
    <p class="muted">Zaten hesabın var mı? <a href="{{ url_for('login') }}">Giriş yap</a></p>
  </div>
</body>
</html>
